<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>{{ title or "空パレット登録画面" }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pallet.css') }}">
</head>

<body class="bg-light">

  <!-- MAIN -->
  <main class="container-fluid p-3">

    <div class="row g-3">
      <div class="col-12">

        <!-- CARD -->
        <div class="card shadow-sm mb-3">
          
          <!-- HEADER -->
          <div class="card-header bg-white text-center fs-2 fw-bold">
            空パレット供給スケジュール
          </div>

          <!-- BODY -->
          <div class="card-body p-0">

            <!-- SCROLLABLE TABLE -->
            <div class="table-scroll-both fs-3">

              <table id="line-table" class="table table-striped table-hover table-bordered align-middle mb-0 table-sticky">
                
                <!-- JS will populate -->
                <thead class="table-light"></thead>
                
                <tbody id="line-state-body">
                </tbody>

              </table>

            </div>

            <!-- BUTTONS -->
            <div class="d-flex justify-content-center gap-4 p-3 border-top">
              <button class="btn btn-warning btn-lg fs-2" id="btn-read">読出</button>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
              <button class="btn btn-danger btn-lg fs-2" id="btn-delete">削除</button>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
              <button class="btn btn-primary btn-lg fs-2" id="btn-edit">変更</button>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
              <button class="btn btn-success btn-lg fs-2" id="btn-add">追加</button>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            </div>

          </div>
        </div>

      </div>
    </div>

  </main>


  <!-- ============================= -->
  <!-- Delete Confirm Modal -->
  <!-- ============================= -->
  <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-md modal-dialog-centered">

      <div class="modal-content">

        <div class="modal-header">
          <h3 class="modal-title fw-bold" id="deleteConfirmModalLabel">確認</h3>
        </div>

        <div class="modal-body text-center">
          このデータを削除しますか？
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-lg btn-danger fs-3" id="deleteExecuteBtn">実行</button>&nbsp;&nbsp;
          <button type="button" class="btn btn-lg btn-secondary fs-3" data-bs-dismiss="modal">キャンセル</button>
        </div>

      </div>

    </div>
  </div>

  <!-- ============================= -->
  <!-- Read Modal -->
  <!-- ============================= -->
  <div class="modal fade" id="readModal" tabindex="-1" aria-labelledby="readModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-md modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">

        <div class="modal-header">
          <h3 class="modal-title fw-bold" id="deleteConfirmModalLabel">パターンを1つ選択してください</h3>
        </div>
        <div class="modal-body">
          <div class="d-grid gap-4">
            <button class="btn btn-lg btn-outline-primary read-pattern" data-pattern="1">
              パターン 1
            </button>
            <button class="btn btn-lg btn-outline-primary read-pattern" data-pattern="2">
              パターン 2
            </button>
            <!-- <button class="btn btn-lg btn-outline-primary read-pattern" data-pattern="3">
              パターン 3
            </button>
            <button class="btn btn-lg btn-outline-primary read-pattern" data-pattern="4">
              パターン 4
            </button> -->
          </div>
        </div>
        
        <div class="modal-footer">
          <button type="button" class="btn btn-lg btn-danger fs-3" id="btn-apply-pattern">
            実行
          </button>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          <button type="button" class="btn btn-lg btn-secondary fs-3" data-bs-dismiss="modal">
            キャンセル
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- ============================= -->
  <!-- Edit/Add Modal -->
  <!-- ============================= -->
  <div class="modal fade" id="editAddModal" tabindex="-1" aria-labelledby="editAddModalLabel">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">

        <div class="modal-header">
          <h3 class="modal-title fw-bold" id="editAddModalLabel">編集</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          
          <div class="row g-3 align-items-stretch">

            <!-- Pallet List -->
    

            <div class="col-12 col-md-6">
              <div class="border rounded h-100 p-2">
                <div class="fw-bold mb-2 text-center">パレット一覧</div>
                <div id="palletList" class="list-group overflow-auto" style="max-height: 400px;">
                </div>
              </div>
            </div>

            <!-- Supply Card + Keypad -->
            <div class="col-12 col-md-6">
              <div class="card h-100">

                <div class="card-header text-center fw-bold">供給数</div>

                <div class="card-body d-flex flex-column">

                  <input type="text"
                         id="supplyInput"
                         class="form-control form-control-lg text-center mb-3"
                         value="10"
                         inputmode="numeric"
                         readonly />

                  <!-- Keypad -->
                  <div class="container px-0">
                    <div class="row g-2">

                      <div class="col-4"><button class="btn btn-outline-secondary w-100 keypad">1</button></div>
                      <div class="col-4"><button class="btn btn-outline-secondary w-100 keypad">2</button></div>
                      <div class="col-4"><button class="btn btn-outline-secondary w-100 keypad">3</button></div>

                      <div class="col-4"><button class="btn btn-outline-secondary w-100 keypad">4</button></div>
                      <div class="col-4"><button class="btn btn-outline-secondary w-100 keypad">5</button></div>
                      <div class="col-4"><button class="btn btn-outline-secondary w-100 keypad">6</button></div>

                      <div class="col-4"><button class="btn btn-outline-secondary w-100 keypad">7</button></div>
                      <div class="col-4"><button class="btn btn-outline-secondary w-100 keypad">8</button></div>
                      <div class="col-4"><button class="btn btn-outline-secondary w-100 keypad">9</button></div>

                      <div class="col-4"><button class="btn btn-outline-danger w-100 keypad">C</button></div>
                      <div class="col-8"><button class="btn btn-outline-secondary w-100 keypad">0</button></div>

                    </div>
                  </div>

                  <div class="mt-auto text-muted small text-center pt-2">
                    数字ボタンを押すと入力値が更新されます
                  </div>

                </div>

              </div>
            </div>

          </div>

        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-lg btn-danger fs-3" id="modalSaveBtn">実行</button>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          <button type="button" class="btn btn-lg btn-secondary fs-3" data-bs-dismiss="modal">キャンセル</button>
        </div>

      </div>
    </div>
  </div>


  <!-- JS -->
  <script src="{{ url_for('static', filename='js/jquery-3.7.0.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pallet-supply.js') }}"></script>

</body>
</html>
